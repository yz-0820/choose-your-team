name = "choose-your-team"
main = "./src/worker.ts"
compatibility_date = "2026-06-08"
keep_vars = true

[vars]
AI_ROAST_ENDPOINT = "https://api.deepseek.com/chat/completions"
AI_ROAST_MODEL = "deepseek-v4-flash"

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[durable_objects]
bindings = [
  { name = "POSTER_COUNTER", class_name = "PosterCounter" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PosterCounter"]
